<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 동네 공기</title>
  <!-- 스타일과 기능을 별도 파일로 연결합니다. -->
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <!-- 지역을 선택하면 해당 지역의 최신 측정 정보를 조회합니다. -->
    <header>
      <div><p class="eyebrow">에어코리아 대기오염정보</p><h1>우리 동네 공기</h1></div>
      <div class="region-control"><label for="region">시도 선택</label><select id="region"></select></div>
    </header>
    <!-- 평균은 유효한 측정값만 사용한 측정소 단순 평균입니다. -->
    <section class="summary" aria-labelledby="summary-title">
      <p id="summary-title"><span id="region-name">전국</span> 평균 미세먼지</p>
      <div class="average"><strong id="average">—</strong><span>마이크로그램/세제곱미터</span></div>
      <p id="average-note">측정 정보를 기다리고 있습니다.</p>
    </section>
    <ul class="legend" aria-label="미세먼지 등급 안내">
      <li class="grade-1">좋음</li><li class="grade-2">보통</li><li class="grade-3">나쁨</li><li class="grade-4">매우나쁨</li><li class="grade-unknown">등급 없음</li>
    </ul>
    <section aria-labelledby="stations-title">
      <div class="section-heading"><h2 id="stations-title">측정소별 대기질</h2><button id="refresh" type="button">새로고침</button></div>
      <p id="status" role="status" aria-live="polite"></p>
      <div id="stations" class="stations" aria-busy="false"></div>
    </section>
    <footer>자료 제공: 한국환경공단 에어코리아 · 실시간 측정 자료는 확정 전 자료입니다.</footer>
  </main>
  <!-- 복제한 카드에는 안전하게 텍스트로 측정 정보를 넣습니다. -->
  <template id="station-template">
    <article class="station">
      <div class="card-heading"><h3></h3><span class="badge"></span></div>
      <dl><div><dt>미세먼지</dt><dd class="pm10"></dd></div><div><dt>초미세먼지</dt><dd class="pm25"></dd></div></dl>
      <p class="unit">단위: 마이크로그램/세제곱미터</p>
      <p class="time"></p>
    </article>
  </template>
</body>
</html>
